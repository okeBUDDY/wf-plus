[workspace]
resolver = "3"
members = ["crates/wf-art", "crates/wf-cook", "crates/wf"]
default-members = ["crates/wf"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
wf-art = { path = "crates/wf-art" }
wf-cook = { path = "crates/wf-cook" }
bytemuck = { version = "1.25", features = ["derive"] }

[profile.dev.package."*"]
opt-level = 2
