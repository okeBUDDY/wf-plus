  #grid { position: absolute; inset: -60%; transform: rotate(-36deg); pointer-events: none;
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);

  #error { color: #ff5a5a; white-space: pre-wrap; max-width: 640px; text-align: left; font-size: 12px; }
  #error-box { display: flex; flex-direction: column; align-items: center; }
  .button { color: var(--yellow); border: 1px solid var(--yellow); background: none; font: inherit; letter-spacing: inherit;
    padding: 9px 20px; cursor: pointer; text-transform: uppercase; }
  .button:hover, .button:focus-visible { background: rgba(255, 208, 0, 0.12); outline: none; }
  .blink { color: var(--yellow); animation: blink 1.2s steps(2, start) infinite; text-transform: uppercase; }
  @keyframes blink { to { visibility: hidden; } }
  .note { color: var(--grey); text-transform: uppercase; font-size: 11px; }
  .note a, .link { color: var(--green); background: none; border: 0; font: inherit; letter-spacing: inherit; cursor: pointer; padding: 0; text-decoration: underline; }

<script>
// Errors on this screen. A classic script, so it runs even where the game's
// module cannot load (a page opened from a file, an old browser).
(() => {
  const $ = (id) => document.getElementById(id);
  const fromFile = location.protocol === 'file:';
  const FILE_HELP = 'This page was opened as a file, and browsers do not let a page opened from a file load the game. '
    + 'Serve the folder over HTTP instead: for example run\n\n  python3 -m http.server\n\nin this folder and open http://localhost:8000.';
  // Shows `msg` in place of the loading bar or the file choice; once.
  window.wfFatal = (msg) => {
    if (window.wfFailed) return;
    window.wfFailed = window.failed = String(msg);
    for (const id of ['loading', 'pick', 'go']) $(id).hidden = true;
    $('screen').hidden = true;
    $('front').hidden = false;
    $('error').textContent = fromFile ? FILE_HELP : String(msg);
    $('error-box').hidden = false;
  };
  addEventListener('error', (e) => window.wfFatal(e.message || 'a script failed to load'));
  addEventListener('unhandledrejection', (e) => window.wfFatal((e.reason && e.reason.message) || e.reason || 'unknown error'));
  if (fromFile) return window.wfFatal(FILE_HELP);
  if (typeof WebAssembly !== 'object') return window.wfFatal('This browser cannot run WebAssembly.');
  if (!document.createElement('canvas').getContext('webgl2')) {
    return window.wfFatal('This browser has no WebGL 2 (or it is turned off), which the game draws with.');
  }
  // The module sets wfBooted first thing; a module that never ran (blocked,
  // or a browser without modules) shows here instead of a stuck screen.
  setTimeout(() => window.wfBooted || window.wfFatal('The game\'s script did not start (blocked by the browser, or no module support).'), 10000);
})();
</script>
<script type="module">
window.wfBooted = true;
const fail = (msg) => window.wfFatal(msg);
// Loaded here (not a static import), so a failure reaches the error screen.
let init, wf;
try {
  wf = await import('./pkg/wfplus.js');
  init = wf.default;
} catch (e) {
  fail(`The game's script could not be loaded: ${(e && e.message) || e}`);
  throw e;
}

// The wasm module's size, written by scripts/build-web.sh (a compressed
// download's Content-Length is not the size the stream gives).
const WASM_SIZE = Number('6655642') || 0;
const DATA_FILES = ['data.bin', 'wf108.zip'];

const $ = (id) => document.getElementById(id);
const show = (id) => { for (const p of ['loading', 'pick', 'go']) $(p).hidden = p !== id; };

// What the game saves (wf.ini, wf.sco, rec/) and the game data, in IndexedDB.
const db = await new Promise((resolve) => {
  try {
    const open = indexedDB.open('wfplus', 1);
    open.onupgradeneeded = () => open.result.createObjectStore('files');
    open.onsuccess = () => resolve(open.result);
    open.onerror = () => resolve(null);
  } catch { resolve(null); }
});
const tx = (mode, f) => new Promise((resolve) => {
  if (!db) return resolve(null);
  const t = db.transaction('files', mode);
  const req = f(t.objectStore('files'));
  t.oncomplete = () => resolve(req && req.result);
  t.onerror = t.onabort = () => resolve(null);
});
// Called by the game (platform::web) when it writes or removes a file.
globalThis.wfStore = {
  put: (path, data, modified) => tx('readwrite', (s) => s.put({ data: data.slice(), modified }, path)),
  delete: (path) => tx('readwrite', (s) => s.delete(path)),
};
if (!db) $('nosave').hidden = false;
const stored = async () => {
  const keys = (await tx('readonly', (s) => s.getAllKeys())) || [];
  const values = (await tx('readonly', (s) => s.getAll())) || [];
  return keys.map((k, i) => [String(k), values[i]]);
};

// The wasm, with its download shown.
async function load() {
  let res;
  try {
    res = await fetch('pkg/wfplus_bg.wasm');
  } catch (e) {
    throw new Error(`The game could not be downloaded (pkg/wfplus_bg.wasm): ${(e && e.message) || e}`);
  }
  if (!res.ok) throw new Error(`The game could not be downloaded: pkg/wfplus_bg.wasm gave ${res.status} ${res.statusText}`);
  const total = WASM_SIZE || Number(res.headers.get('Content-Length')) || 0;
  const mb = (n) => (n / 1048576).toFixed(1);
  const reader = res.body.getReader();
  const parts = [];
  let got = 0;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    parts.push(value);
    got += value.length;
    $('fill').style.width = total ? `${Math.min(100, (got / total) * 100)}%` : '50%';
    $('status').textContent = total ? `Loading ${mb(got)} / ${mb(total)} MB` : `Loading ${mb(got)} MB`;
  }
  $('fill').style.width = '100%';
  $('status').textContent = 'Starting';
  const bytes = new Uint8Array(got);
  let at = 0;
  for (const p of parts) { bytes.set(p, at); at += p.length; }
  await init({ module_or_path: bytes });
}

let started = false;
async function start() {
  if (started || window.wfFailed) return;
  started = true;
  const canvas = $('screen');
  // The canvas covers what is visible: on phones the visual viewport, which
  // the address bar and the toolbar shrink (100vh does not).
  const fit = () => {
    const v = window.visualViewport;
    const w = v ? v.width : innerWidth;
    const h = v ? v.height : innerHeight;
    canvas.style.left = `${v ? v.offsetLeft : 0}px`;
    canvas.style.top = `${v ? v.offsetTop : 0}px`;
    canvas.style.width = `${w}px`;
    canvas.style.height = `${h}px`;
    canvas.width = Math.max(1, Math.round(w * devicePixelRatio));
    canvas.height = Math.max(1, Math.round(h * devicePixelRatio));
  };
  fit();
  addEventListener('resize', fit);
  addEventListener('orientationchange', () => setTimeout(fit, 250));
  if (window.visualViewport) {
    visualViewport.addEventListener('resize', fit);
    visualViewport.addEventListener('scroll', fit);
  }
  // A phone or tablet: the whole screen, without the browser's bars (the
  // click or key that started the game allows it; a refusal is fine).
  if (matchMedia('(pointer: coarse)').matches && document.documentElement.requestFullscreen) {
    document.documentElement.requestFullscreen({ navigationUI: 'hide' }).catch(() => {});
  }
  canvas.hidden = false;
  try {
    // The title's EXIT: back to this page's start, ready to play again.
    await wf.start(canvas, undefined, () => location.reload());
    if (window.wfFailed) return;
    $('front').hidden = true;
    canvas.focus();
    window.started = true;
  } catch (e) {
    fail(`The game could not start: ${(e && e.message) || e}`);
  }
}

// The game data: a picked or dropped file, kept for the next visit.
async function useData(file) {
  let bytes;
  try {
    bytes = new Uint8Array(await file.arrayBuffer());
  } catch (e) {
    return fail(`${file.name} could not be read: ${(e && e.message) || e}`);
  }
  // A zip starts with "PK".
  const name = bytes[0] === 0x50 && bytes[1] === 0x4b ? 'wf108.zip' : 'data.bin';
  for (const n of DATA_FILES) await tx('readwrite', (s) => s.delete(n));
  await tx('readwrite', (s) => s.put({ data: bytes, modified: Date.now() }, name));
  wf.put_file(name, bytes, Date.now());
  // Picking the file was a click: the audio may start.
  start();
}
$('file').addEventListener('change', (e) => e.target.files[0] && useData(e.target.files[0]));
addEventListener('dragover', (e) => e.preventDefault());
addEventListener('drop', (e) => {
  e.preventDefault();
  const file = e.dataTransfer.files[0];
  if (file && !$('pick').hidden) useData(file);
});
// After an error with the data stored, the way out is other data.
$('forget-error').hidden = false;
const forget = async () => {
  for (const n of DATA_FILES) await tx('readwrite', (s) => s.delete(n));
  location.reload();
};
$('forget').addEventListener('click', forget);
$('forget-error').addEventListener('click', forget);

try {
  await load();
  const files = await stored();
  for (const [path, f] of files) wf.put_file(path, f.data, f.modified);
  if (files.some(([p]) => DATA_FILES.includes(p))) {
    // Browsers let the audio start only after a click or a key.
    show('go');
    const go = (e) => {
      if (window.wfFailed || (e.target.closest && e.target.closest('#forget'))) return;
      removeEventListener('pointerdown', go);
      removeEventListener('keydown', go);
      start();
    };
    addEventListener('pointerdown', go);
    addEventListener('keydown', go);
  } else {
    show('pick');
  }
} catch (e) {
  fail(String((e && e.message) || e));
}
</script>
</html>
