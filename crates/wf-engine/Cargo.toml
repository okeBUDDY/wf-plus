[package]
name = "wf-engine"
description = "The engine under the Warning Forever port: app loop, time, Slug renderer, assets, audio, input, config and the SDL3 platform."
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
wf-art.workspace = true
bytemuck.workspace = true
wgpu = "30"
pollster = "1"
# Instant and SystemTime that work in a browser too (std's panic there).
web-time = "1"
lewton = "0.10"
raw-window-handle = "0.6"

# SDL3 is the platform everywhere but the browser (see platform::web).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sdl3 = { version = "0.22", features = ["build-from-source-static", "raw-window-handle"] }

# The browser: WebGL2 through wgpu's GL backend, the page through web-sys.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30", features = ["webgl"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window", "Document", "HtmlCanvasElement", "Element", "DomRect", "EventTarget", "Event",
    "AddEventListenerOptions", "KeyboardEvent", "MouseEvent", "PointerEvent", "WheelEvent",
    "Navigator", "Gamepad", "GamepadButton", "AudioContext", "AudioContextOptions",
    "AudioContextState", "BaseAudioContext", "AudioBuffer", "AudioBufferSourceNode",
    "AudioScheduledSourceNode", "AudioNode", "AudioDestinationNode", "console",
] }
