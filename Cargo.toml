[workspace]
resolver = "3"
members = ["crates/wf-art", "crates/wf-cook", "crates/wf-engine", "crates/wf"]
default-members = ["crates/wf"]

[workspace.package]
edition = "2024"
# Warning Forever+'s version (crates/wf/src/app_info.rs). No licence: see
# the README's Licence section.
version = "1.0.0"
publish = false

[workspace.dependencies]
wf-art = { path = "crates/wf-art" }
wf-cook = { path = "crates/wf-cook" }
wf-engine = { path = "crates/wf-engine" }
bytemuck = { version = "1.25", features = ["derive"] }

[profile.dev.package."*"]
opt-level = 2

# The browser build (scripts/build-web.sh): the release, smaller to download.
[profile.web]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "debuginfo"
