[package]
name = "wf"
description = "Warning Forever, ported to Rust."
edition.workspace = true
version.workspace = true
build = "build.rs"

[dependencies]
wf-art.workspace = true
wf-engine.workspace = true
bytemuck.workspace = true
sdl3 = { version = "0.22", features = ["build-from-source-static", "raw-window-handle"] }
wgpu = "30"
pollster = "1"
lewton = "0.10"
encoding_rs = "0.8"
# The sim's atan2/sin/cos: pure Rust (the musl port), the same bits on
# every platform, unlike the system libm.
libm = "0.2.16"
png = "0.18"
raw-window-handle = "0.6"

[build-dependencies]
wf-cook.workspace = true
wf-art.workspace = true

# The exe's icon resource. Cargo matches a build dependency's cfg against
# the host, so Windows builds embed it (see build.rs); others never fetch it.
[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1.34"
