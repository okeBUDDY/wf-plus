[package]
name = "wf"
description = "Warning Forever, ported to Rust."
edition.workspace = true
# Warning Forever+'s own version (see src/app_info.rs), based on the
# original's 1.08.
version = "1.1.1"
publish.workspace = true
build = "build.rs"

# The Android entry point (the activity loads libwfplus.so, System.loadLibrary
# "wfplus"; Android requires the lib prefix, and calls SDL_main in it) and the
# browser's wasm module. Empty on other targets (see src/lib.rs).
[lib]
name = "wfplus"
path = "src/lib.rs"
crate-type = ["cdylib"]
test = false
doctest = false

# `wfplus` (wf+.exe in the Windows zip, see scripts/build-windows.sh).
[[bin]]
name = "wfplus"
path = "src/main.rs"

[dependencies]
wf-art.workspace = true
wf-engine.workspace = true
bytemuck.workspace = true
wgpu = "30"
pollster = "1"
# Instant and SystemTime that work in a browser too (std's panic there).
web-time = "1"
lewton = "0.10"
encoding_rs = "0.8"
# The sim's atan2/sin/cos: pure Rust (the musl port), the same bits on
# every platform, unlike the system libm.
libm = "0.2.16"
png = "0.18"
raw-window-handle = "0.6"
# data.bin out of wf108.zip (already in the tree through png).
miniz_oxide = "0.9"

[build-dependencies]
wf-cook.workspace = true
wf-art.workspace = true
# The exe's version resource, icon and manifest: build.rs uses it when
# the target is Windows (a build dependency's cfg would match the host).
winresource = "0.1.34"

# SDL3 is the platform everywhere but the browser (see platform::web).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sdl3 = { version = "0.22", features = ["build-from-source-static", "raw-window-handle"] }

# The browser (see src/web.rs).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30", features = ["webgl"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "KeyboardEvent", "console"] }
